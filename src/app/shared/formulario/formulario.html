<div class="max-w-5xl mx-auto p-6 bg-orange-50 min-h-screen">
  
  <h1 class="text-3xl font-extrabold text-blue-900 mb-8 border-b-4 border-green-600 inline-block">
    Gestión de Usuarios - Veterinaria
  </h1>

  <div class="bg-white p-6 rounded-2xl shadow-xl border border-green-200 mb-10">
    <h2 class="text-xl font-bold text-green-700 mb-4">Registro Rápido</h2>
    <form (ngSubmit)="registrarUsuario()" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <input [(ngModel)]="nuevoUsuario.nombre" name="nombre" type="text" placeholder="Nombre completo" required
        class="w-full px-4 py-2 rounded-lg border border-green-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
      
      <input [(ngModel)]="nuevoUsuario.email" name="email" type="email" placeholder="Correo" required
        class="w-full px-4 py-2 rounded-lg border border-green-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
      
      <input [(ngModel)]="nuevoUsuario.password" name="password" type="password" placeholder="***" required
      class="w-full px-4 py-2 rounded-lg border border-green-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
      
        <button type="submit" 
        class="md:col-span-3 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition-colors shadow-lg shadow-green-200">
        REGISTRAR
      </button>
    </form>
  </div>

  <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-green-200">
    <table class="w-full text-left border-collapse">
      <thead class="bg-blue-900 text-orange-100">
        <tr>
          <th class="p-4 font-semibold uppercase text-sm">Acciones</th>
          <th class="p-4 font-semibold uppercase text-sm">ID</th>
          <th class="p-4 font-semibold uppercase text-sm">Nombre</th>
          <th class="p-4 font-semibold uppercase text-sm">Email</th>
        </tr>
      </thead>
      <tbody>
        @for(usuario of listaUsuarios(); track usuario.id){
          <tr class="border-b border-green-100 hover:bg-orange-100 transition-colors">
            <td class="p-4 text-blue-900 font-mono text-xs">
              @if (authService.rolActual()==='ADMIN') {
              <button (click)="editarUsuario(usuario)" class="pr-10 text-green-700">✏️​</button>
              <button (click)="eliminarUsuario(usuario.id!)" class="text-red-600">🗑​</button>
              }@else {
                <span class="text-orange-500">🔒</span>
              }
            </td>
            <td class="p-4 text-blue-900 font-mono text-xs">{{usuario.id}}</td>
            <td class="p-4 text-green-700 font-medium">{{usuario.nombre}}</td>
            <td class="p-4 text-orange-600">{{usuario.email}}</td>
          </tr>
        }
        @empty{
          <tr>
            <td colspan="4" class="p-8 text-center text-blue-400 italic">
              Cargando usuarios desde la API...
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
