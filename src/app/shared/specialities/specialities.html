<div class="max-w-5xl mx-auto p-6 bg-orange-50 min-h-screen">
  <h1 class="text-3xl font-extrabold text-blue-900 mb-8 border-b-4 border-green-600 inline-block">
    {{ subtitulo }}
  </h1>

  <input type="text" (input)="buscar($event)" placeholder="Buscar servicio..."
    class="w-full px-4 py-2 mb-6 rounded-lg border border-green-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    @for(servicio of especialidadesFiltradas; track servicio.id){
      <div class="bg-white rounded-xl shadow-lg border border-green-200 p-4 hover:bg-orange-100 transition-colors">
        <img [src]="servicio.imagen" [alt]="servicio.nombre" class="h-40 w-40 object-contain mx-auto mb-4">
        <h2 class="text-center text-green-700 font-bold text-lg">{{ servicio.nombre }}</h2>
        <p class="text-center text-blue-900">{{ servicio.descripcion }}</p>
        <button (click)="seleccionar(servicio.nombre)"
          class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg shadow-md">
          Seleccionar
        </button>
      </div>
    }
    @empty{
      <p class="text-center text-orange-500 italic">No se encontraron servicios...</p>
    }
  </div>
</div>
