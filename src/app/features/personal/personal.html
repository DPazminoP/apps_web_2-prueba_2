<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
    @for (trabajador of trabajadores(); track trabajador.id) {
        <div class="border-2 border-black bg-yellow-50 rounded-lg p-4">
        
        <h2 class="text-center font-bold text-lg mt-2">
            Fotografía del trabajador
        </h2>
        <img
            class="h-40 w-40 object-cover rounded-full mx-auto mt-2"
            [src]="trabajador.image ?? 'assets/placeholder.png'"
            [alt]="trabajador.name">

        
        <h2 class="text-center font-bold text-lg mt-2">
            Nombre: {{ trabajador.name }}
        </h2>

        
        <p class="text-center text-gray-600">
            Género: @switch (trabajador.gender) {
                @case ('MALE') { Masculino }
                @case ('FEMALE') { Femenino }
                @default { Desconocido }
            }
        </p>
        </div>
    }
</div>
